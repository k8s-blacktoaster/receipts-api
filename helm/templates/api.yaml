apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-api-config
  namespace: {{ .Values.namespace }}
data:
  PORT: "8080"
  ENVIRONMENT: {{ .Values.api.environment | quote }}
  LOG_LEVEL: {{ .Values.api.logLevel | quote }}
  MIGRATIONS_PATH: /app/migrations
  UPLOAD_DIR: /app/data/uploads
  MAX_UPLOAD_BYTES: {{ .Values.api.maxUploadBytes | int64 | quote }}
  IMAGE_DECODE_BUDGET_BYTES: {{ .Values.api.imageDecodeBudgetBytes | int64 | quote }}
  GOMEMLIMIT: {{ .Values.api.goMemLimit | quote }}
  EXTRACTION_PROVIDER: {{ .Values.api.extraction.provider | quote }}
  {{- with .Values.api.extraction.model }}
  EXTRACTION_MODEL: {{ . | quote }}
  {{- end }}
  EXTRACTION_REASONING_EFFORT: {{ .Values.api.extraction.reasoningEffort | quote }}
  EXTRACTION_TIMEOUT_SECONDS: {{ .Values.api.extraction.timeoutSeconds | quote }}
  EXTRACTION_WORKERS: {{ .Values.api.extraction.workers | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-uploads
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-api
  annotations:
    helm.sh/resource-policy: keep   # receipt photos survive helm uninstall
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.api.uploads.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.uploads.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  # RWO uploads volume + in-process extraction worker: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
      annotations:
        checksum/config: {{ toJson .Values.api | sha256sum | trunc 16 }}
    spec:
      securityContext:
        {{- include "receipts.podSecurity" . | nindent 8 }}
      terminationGracePeriodSeconds: 35   # EXTRACTION_SHUTDOWN_TIMEOUT (25s) + margin
      initContainers:
        # Wait for Postgres, then apply migrations (the api also runs them at start; this
        # makes a failed migration block the rollout visibly instead of crash-looping).
        - name: migrate
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          command: ["/bin/sh", "-c", "for i in $(seq 1 60); do ./migrate up && exit 0; echo waiting for postgres; sleep 5; done; exit 1"]
          env:
            {{- include "receipts.dbEnv" . | nindent 12 }}
            - name: MIGRATIONS_PATH
              value: /app/migrations
          securityContext:
            {{- include "receipts.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      containers:
        - name: api
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-api-config
          env:
            {{- include "receipts.dbEnv" . | nindent 12 }}
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "receipts.secret" . }}
                  key: xai-api-key
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "receipts.secret" . }}
                  key: mcp-token
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
            - name: tmp          # heif-dec temp files (read-only root fs)
              mountPath: /tmp
          # readiness pings the DB (2s timeout); liveness does not, so a DB outage only
          # removes the pod from the Service instead of restart-looping it.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          securityContext:
            {{- include "receipts.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-uploads
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-api
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
