{{- if .Values.externalSecrets.enabled }}
# All app secrets, synced from Vault ({{ .Values.externalSecrets.vaultKey }}) into one Secret.
# Vault properties are kebab-case; the Secret keys keep those names and the pods map them to
# env vars (xai-api-key -> XAI_API_KEY, mcp-token -> MCP_TOKEN, db-password -> DB_PASSWORD /
# POSTGRES_PASSWORD / PGPASSWORD).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "receipts.secret" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "receipts.secret" . }}
    creationPolicy: Owner
  data:
    {{- range list "xai-api-key" "mcp-token" "db-password" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecrets.vaultKey }}
        property: {{ . }}
    {{- end }}
{{- end }}
