{{- if .Values.certificate.enabled }}
# Explicit cert-manager Certificate. The vault-issuer ClusterIssuer mints the cert
# into the ingress TLS secret; the ingress only references that secret by name.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.certificate.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/component: certificate
spec:
  commonName: {{ .Values.host }}
  secretName: {{ .Values.ingress.tlsSecretName }}
  issuerRef:
    name: {{ .Values.certificate.issuerRef.name }}
    kind: {{ .Values.certificate.issuerRef.kind }}
    group: {{ .Values.certificate.issuerRef.group }}
  dnsNames:
    - {{ .Values.host }}
{{- end }}
