<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Receipts</title>
<link rel="stylesheet" href="/static/app.css">
{{block "head" .}}{{end}}
</head>
<body>
<header class="top">
  <a class="brand" href="/receipts">Receipts</a>
  <nav><a href="/receipts">List</a> {{if .HasReview}}<a href="/review">Review</a> {{end}}<a href="/merchants">Merchants</a>
  <a class="who" href="/member?next=/receipts">{{if .Member}}{{.Member.DisplayName}}{{else}}Pick member{{end}}</a></nav>
</header>
<main>
{{if .Err}}<div class="banner err" role="alert">{{.Err}}</div>{{end}}
{{if .Msg}}<div class="banner ok" role="status">{{.Msg}}</div>{{end}}
{{template "content" .}}
</main>
<script src="/static/app.js"></script>
</body>
</html>
